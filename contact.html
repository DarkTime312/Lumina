<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://lib.arvancloud.ir/font-awesome/6.3.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/main.css" />
    <title>Lumina Creative</title>
  </head>
  <body>
    <header class="top-header">
      <div class="top-header__content u-fixed-width--narrow">
        <img src="images/logo.png" alt="Logo" class="logo" />
        <nav class="navbar">
          <ul class="navbar__list">
            <li class="navbar__item">
              <a href="index.html" class="navbar__link">Home</a>
            </li>
            <li class="navbar__item">
              <a href="about.html" class="navbar__link">About</a>
            </li>
            <li class="navbar__item">
              <a href="#" class="navbar__link navbar__link--active">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="slogan slogan--dark">
      <div class="slogan__content u-fixed-width--narrow">
        <p class="slogan__text">
          <span class="u-highlight">Enthusiastic</span> thinkers, creating
          unique endeavors powered by
          <span class="u-highlight">creativity</span>
        </p>
      </div>
    </section>

    <section class="questions">
      <div class="questions__content u-fixed-width--narrow">
        <h2 class="questions__main-title">Contact Us</h2>
        <p class="questions__description">
          Have a question? Leave your information below and we will get back to
          you as soon as possible.
        </p>

        <form action="/submit" class="form">
          <div class="form__group">
            <label for="first-name" class="form__label u-sr-only"
              >First Name</label
            >
            <input
              type="text"
              id="first-name"
              name="first-name"
              class="form__input"
              placeholder="First Name"
              required
            />
          </div>
          <div class="form__group">
            <label for="last-name" class="form__label u-sr-only"
              >Last Name</label
            >
            <input
              type="text"
              id="last-name"
              name="last-name"
              class="form__input"
              placeholder="Last Name"
              required
            />
          </div>
          <div class="form__group">
            <label for="email" class="form__label u-sr-only">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form__input"
              placeholder="Email"
              required
            />
          </div>
          <div class="form__group">
            <label for="message" class="form__label u-sr-only">Message</label>
            <textarea
              id="message"
              name="message"
              class="form__message"
              placeholder="Message"
              rows="9"
              required
            ></textarea>
          </div>
          <button type="submit" class="form__submit-btn">Send Message</button>
        </form>
      </div>
    </section>

    <footer class="main-footer">
      <div class="main-footer__content u-fixed-width--normal">
        <img src="images/logo.png" alt="Logo" class="logo" />
        <section class="contact">
          <h2 class="contact__title">Contact Us</h2>
          <address class="contact__body">
            <a href="tel:5555555" class="contact__phone">(555) 555-5555</a>
            <a href="mailto:contact@lumina.test" class="contact__email"
              >contact@lumina.test</a
            >
            <p class="contact__address">10 Main st Boston MA</p>
          </address>
        </section>
        <section class="social">
          <h2 class="social__title">Follow Us</h2>

          <ul class="social__list">
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-facebook fa-2x"></i>
              </a>
            </li>
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-twitter fa-2x"></i>
              </a>
            </li>
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-instagram fa-2x"></i>
              </a>
            </li>
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-pinterest fa-2x"></i>
              </a>
            </li>
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-tumblr fa-2x"></i>
              </a>
            </li>
          </ul>
        </section>
      </div>
    </footer>
  </body>
</html>
