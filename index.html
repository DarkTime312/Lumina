<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://lib.arvancloud.ir/font-awesome/6.3.0/css/all.min.css""
    />

    <link rel="stylesheet" href="css/main.css" />
    <title>Lumina Creative</title>
  </head>
  <body>
    <header class="top-header">
      <div class="top-header__content u-fixed-width--medium">
        <img src="images/logo.png" alt="Logo" class="logo" />
        <nav class="navbar">
          <ul class="navbar__list">
            <li class="navbar__item">
              <a href="#" class="navbar__link navbar__link--active">Home</a>
            </li>
            <li class="navbar__item">
              <a href="#" class="navbar__link">About</a>
            </li>
            <li class="navbar__item">
              <a href="#" class="navbar__link">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="slogan">
      <div class="slogan__content u-fixed-width--medium">
        <p class="slogan__text">
          <span class="u-highlight">Passionate</span> creatives crafting
          distinct projects, driven by
          <span class="u-highlight">innovation</span>
        </p>
      </div>
    </section>

    <section class="gallery u-fixed-width--big">
      <img src="images/portfolio1.jpg" alt="" class="gallery__image" />
      <img src="images/portfolio2.jpg" alt="" class="gallery__image" />
      <img src="images/portfolio3.jpg" alt="" class="gallery__image" />
      <img src="images/portfolio4.jpg" alt="" class="gallery__image" />
      <img src="images/portfolio5.jpg" alt="" class="gallery__image" />
      <img src="images/portfolio6.jpg" alt="" class="gallery__image" />
      <img src="images/portfolio7.jpg" alt="" class="gallery__image" />
      <img src="images/portfolio8.jpg" alt="" class="gallery__image" />
      <img src="images/portfolio9.jpg" alt="" class="gallery__image" />
    </section>

    <section class="main-footer">
      <div class="main-footer__content">
        <img src="images/logo.png" alt="Logo" class="logo" />
        <section class="contact">
          <h2 class="contact__title">Contact Us</h2>
          <address class="contact__body">
            <a href="tel:5555555" class="contact__phone">(555) 555-5555</a>
            <a href="mailto:contact@lumina.test" class="contact__email"
              >contact@lumina.test</a
            >
            <p class="contact__address">10 Main st Boston MA</p>
          </address>
        </section>
        <section class="social">
          <h2 class="social__title">Follow Us</h2>

          <ul class="social__list">
            <li class="social__item">
          <a href="#" class="social__link">
            <i class="fab fa-facebook fa-2x"></i>
          </a>
            </li>
            <li class="social__item">
          <a href="#" class="social__link">
            <i class="fab fa-twitter fa-2x"></i>
          </a>
            </li>
            <li class="social__item">
          <a href="#" class="social__link">
            <i class="fab fa-instagram fa-2x"></i>
          </a>
            </li>
            <li class="social__item">
          <a href="#" class="social__link">
            <i class="fab fa-pinterest fa-2x"></i>
          </a>
            </li>
            <li class="social__item">
          <a href="#" class="social__link">
            <i class="fab fa-tumblr fa-2x"></i>
          </a>
            </li>
          </ul>
        </section>
      </div>
    </section>
  </body>
</html>
