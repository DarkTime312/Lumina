<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.css"
      integrity="sha512-Woz+DqWYJ51bpVk5Fv0yES/edIMXjj3Ynda+KWTIkGoynAMHrqTcDUQltbipuiaD5ymEo9520lyoVOo9jCQOCA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://lib.arvancloud.ir/font-awesome/6.3.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/main.css" />
    <title>Lumina Creative</title>
  </head>
  <body>
    <header class="top-header">
      <div class="top-header__content u-fixed-width--narrow">
        <img src="images/logo.png" alt="Logo" class="logo" />
        <nav class="navbar">
          <ul class="navbar__list">
            <li class="navbar__item">
              <a href="#" class="navbar__link navbar__link--active">Home</a>
            </li>
            <li class="navbar__item">
              <a href="about.html" class="navbar__link">About</a>
            </li>
            <li class="navbar__item">
              <a href="contact.html" class="navbar__link">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="slogan">
      <div class="slogan__content u-fixed-width--narrow">
        <p class="slogan__text">
          <span class="u-highlight">Passionate</span> creatives crafting
          distinct projects, driven by
          <span class="u-highlight">innovation</span>
        </p>
      </div>
    </section>

    <section class="gallery">
      <div class="gallery__content u-fixed-width--wide">
        <a
          href="images/image1.jpg"
          class="gallery__link"
          data-lightbox="image-1"
          data-title="Image 1"
          ><img
            src="images/portfolio1.jpg"
            alt="Portfolio Item 1"
            class="gallery__image"
        /></a>
        <a
          href="images/image2.jpg"
          class="gallery__link"
          data-lightbox="image-2"
          data-title="Image 2"
          ><img
            src="images/portfolio2.jpg"
            alt="Portfolio Item 2"
            class="gallery__image"
        /></a>
        <a
          href="images/image3.jpg"
          class="gallery__link"
          data-lightbox="image-3"
          data-title="Image 3"
          ><img
            src="images/portfolio3.jpg"
            alt="Portfolio Item 3"
            class="gallery__image"
        /></a>
        <a
          href="images/image4.jpg"
          class="gallery__link"
          data-lightbox="image-4"
          data-title="Image 4"
          ><img
            src="images/portfolio4.jpg"
            alt="Portfolio Item 4"
            class="gallery__image"
        /></a>
        <a
          href="images/image5.jpg"
          class="gallery__link"
          data-lightbox="image-5"
          data-title="Image 5"
          ><img
            src="images/portfolio5.jpg"
            alt="Portfolio Item 5"
            class="gallery__image"
        /></a>
        <a
          href="images/image6.jpg"
          class="gallery__link"
          data-lightbox="image-6"
          data-title="Image 6"
          ><img
            src="images/portfolio6.jpg"
            alt="Portfolio Item 6"
            class="gallery__image"
        /></a>
        <a
          href="images/image7.jpg"
          class="gallery__link"
          data-lightbox="image-7"
          data-title="Image 7"
          ><img
            src="images/portfolio7.jpg"
            alt="Portfolio Item 7"
            class="gallery__image"
        /></a>
        <a
          href="images/image8.jpg"
          class="gallery__link"
          data-lightbox="image-8"
          data-title="Image 8"
          ><img
            src="images/portfolio8.jpg"
            alt="Portfolio Item 8"
            class="gallery__image"
        /></a>
        <a
          href="images/image9.jpg"
          class="gallery__link"
          data-lightbox="image-9"
          data-title="Image 9"
          ><img
            src="images/portfolio9.jpg"
            alt="Portfolio Item 9"
            class="gallery__image"
        /></a>
      </div>
    </section>

    <footer class="main-footer">
      <div class="main-footer__content u-fixed-width--normal">
        <img src="images/logo.png" alt="Logo" class="logo" />
        <section class="contact">
          <h2 class="contact__title">Contact Us</h2>
          <address class="contact__body">
            <a href="tel:5555555" class="contact__phone">(555) 555-5555</a>
            <a href="mailto:contact@lumina.test" class="contact__email"
              >contact@lumina.test</a
            >
            <p class="contact__address">10 Main st Boston MA</p>
          </address>
        </section>
        <section class="social">
          <h2 class="social__title">Follow Us</h2>

          <ul class="social__list">
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-facebook fa-2x"></i>
              </a>
            </li>
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-twitter fa-2x"></i>
              </a>
            </li>
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-instagram fa-2x"></i>
              </a>
            </li>
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-pinterest fa-2x"></i>
              </a>
            </li>
            <li class="social__item">
              <a href="#" class="social__link">
                <i class="fab fa-tumblr fa-2x"></i>
              </a>
            </li>
          </ul>
        </section>
      </div>
    </footer>
    <script
      src="https://lib.arvancloud.ir/jquery/3.6.3/jquery.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://lib.arvancloud.ir/lightbox2/2.9.0/js/lightbox.js"></script>
  </body>
</html>
